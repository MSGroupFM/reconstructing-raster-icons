[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstructing-raster-icons"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "PyYAML>=6.0.3,<7",
  "scipy>=1.14,<2",
  "svgpathtools>=1.6,<2",
]

[project.optional-dependencies]
lock = ["pip-tools==7.5.0"]
