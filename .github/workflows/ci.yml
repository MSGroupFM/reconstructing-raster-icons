name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          npm ci --no-audit --no-fund

      - name: Run portable test suite
        run: >-
          python -m unittest -v
          tests.test_cli
          tests.test_component_metrics
          tests.test_gate_catalog
          tests.test_metrics
          tests.test_morphology
          tests.test_path_geometry
          tests.test_pipeline
          tests.test_python_support
          tests.test_raster_normalization
          tests.test_release_package
          tests.test_renderer
          tests.test_safe_svg
          tests.test_schema_contracts
          tests.test_validate_skill
          tests.test_vtracer_workflow_contract
          tests.test_conformance.FixtureGeneratorTests
          tests.test_conformance.IndependentMetricGoldenTests
          tests.test_conformance.PipelineCorpusTests
          tests.test_conformance.ContractAndStatusCorpusTests
          tests.test_conformance.AdversarialCorpusTests

      - name: Validate skill and schemas
        run: |
          python scripts/validate_skill.py --path .
          python scripts/validate_schemas.py --schemas schemas --documents tests/fixtures/contracts/valid-*.json

      - name: Reject machine-local path leaks
        shell: bash
        run: |
          if rg -n "/""Users/|/private/""tmp/reconstructing-raster-icons-work" . \
            --glob '!tests/behavioral/evidence/**' \
            --glob '!node_modules/**' \
            --glob '!.git/**'; then
            echo "machine-local path leak detected" >&2
            exit 1
          fi

      - name: Build and revalidate deterministic archive
        run: >-
          python scripts/build_release.py
          --source .
          --output "${RUNNER_TEMP}/release-${{ matrix.python-version }}"
          --version 0.2.0

  canonical-linux-x64:
    name: Canonical Linux x64 / Node 22.14.0
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"

      - name: Install exact locks online
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          npm ci --no-audit --no-fund
          test "$(node_modules/node/bin/node --version)" = "v22.14.0"

      - name: Run canonical V8 startup gate with zero skips
        run: >-
          python -c 'import unittest;
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_renderer.RendererTests.test_linux_x64_bundled_node_v8_starts_under_canonical_old_space_contract");
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)'

      - name: Run canonical Task 9 suite with zero skips
        run: >-
          python -c 'import unittest;
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_conformance.CanonicalPlatformConformanceTests");
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)'

  canonical-darwin-arm64:
    name: Canonical Darwin arm64 / Node 22.14.0
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"

      - name: Require Darwin arm64 host
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install exact locks online
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          npm ci --no-audit --no-fund
          test "$(node_modules/node/bin/node --version)" = "v22.14.0"

      - name: Run canonical Task 9 suite with zero skips
        run: >-
          python -c 'import unittest;
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_conformance.CanonicalPlatformConformanceTests");
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)'
